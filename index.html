<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="A bilingual Persian/English reasoning test — 30 items, 25 minutes, one number at the end.">
<title>IQ game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=DM+Mono:wght@400;500&family=Vazirmatn:wght@400..900&display=swap">
<style>
/* ============================================================
   IQ game — an instrument, not a quiz app.
   Palette: ink panel (dark) / blueprint paper (light), one brass signal.
   ============================================================ */

:root{
  --ground:#EDF0F4;
  --panel:#FFFFFF;
  --panel-2:#F4F6F9;
  --ink:#141C2B;
  --ink-dim:#5A6779;
  --rule:rgba(20,28,43,.13);
  --rule-2:rgba(20,28,43,.30);
  --grid:rgba(20,28,43,.055);
  --iso-top:#FFFFFF;
  --iso-l:#C9D2DE;
  --iso-r:#AAB6C6;
  --signal:#8F600A;
  --signal-soft:rgba(143,96,10,.14);
  --right:#2C7A54;
  --right-soft:rgba(44,122,84,.12);
  --wrong:#A0473A;
  --wrong-soft:rgba(160,71,58,.12);
  --lift:0 1px 2px rgba(20,28,43,.06);

  --font-body:'Archivo', system-ui, -apple-system, sans-serif;
  --font-display:'Archivo', system-ui, sans-serif;
  --font-read:'DM Mono', ui-monospace, SFMono-Regular, monospace;
  --wide:'wdth' 112;

  --step:.5rem;
  --radius:3px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1524;
    --panel:#151E31;
    --panel-2:#1B2740;
    --ink:#E7EBF2;
    --ink-dim:#8A97AC;
    --rule:rgba(231,235,242,.13);
    --rule-2:rgba(231,235,242,.30);
    --grid:rgba(231,235,242,.05);
    --iso-top:#33456A;
    --iso-l:#1E2C48;
    --iso-r:#151F33;
    --signal:#E0A83C;
    --signal-soft:rgba(224,168,60,.16);
    --right:#5BB98C;
    --right-soft:rgba(91,185,140,.14);
    --wrong:#D08476;
    --wrong-soft:rgba(208,132,118,.14);
    --lift:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1524;
  --panel:#151E31;
  --panel-2:#1B2740;
  --ink:#E7EBF2;
  --ink-dim:#8A97AC;
  --rule:rgba(231,235,242,.13);
  --rule-2:rgba(231,235,242,.30);
  --grid:rgba(231,235,242,.05);
  --iso-top:#33456A;
  --iso-l:#1E2C48;
  --iso-r:#151F33;
  --signal:#E0A83C;
  --signal-soft:rgba(224,168,60,.16);
  --right:#5BB98C;
  --right-soft:rgba(91,185,140,.14);
  --wrong:#D08476;
  --wrong-soft:rgba(208,132,118,.14);
  --lift:0 1px 2px rgba(0,0,0,.35);
}

html[lang="fa"]{
  --font-body:'Vazirmatn', system-ui, Tahoma, sans-serif;
  --font-display:'Vazirmatn', system-ui, Tahoma, sans-serif;
  --font-read:'Vazirmatn', system-ui, Tahoma, sans-serif;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}

body{
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.6;
  min-height:100vh;
  /* faint engineering grid — the instrument's ground */
  background-image:
    linear-gradient(to right, var(--grid) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
  background-size:46px 46px;
  background-position:center top;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%, transparent 40%, var(--ground) 100%);
  opacity:.85;
}

.shell{
  position:relative;
  max-width:1000px;
  margin:0 auto;
  padding:0 clamp(12px,3vw,28px) 56px;
}

/* ---------- toolbar ---------- */
.bar{
  display:flex;align-items:center;gap:12px;
  padding:18px 0 14px;
  border-bottom:1px solid var(--rule);
  flex-wrap:wrap;
}
.brand{display:flex;flex-direction:column;gap:1px;margin-inline-end:auto;}
.brand b{
  font-family:var(--font-display);font-weight:800;font-size:1.15rem;
  font-variation-settings:var(--wide);letter-spacing:.01em;line-height:1.1;
}
.brand span{
  font-family:var(--font-read);font-size:.66rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);
}
html[lang="fa"] .brand span{letter-spacing:0;font-size:.72rem;}

.readout{
  font-family:var(--font-read);font-size:1.02rem;font-variant-numeric:tabular-nums;
  letter-spacing:.06em;color:var(--ink-dim);
  border:1px solid var(--rule);border-radius:var(--radius);
  padding:5px 11px;background:var(--panel);min-width:5.6em;text-align:center;
  transition:color .2s, border-color .2s;
}
.readout.hot{color:var(--signal);border-color:var(--signal);}
.readout[hidden]{display:none;}

.tools{display:flex;gap:8px;align-items:center;}
#langBtn{font-family:'Vazirmatn','Archivo',system-ui,sans-serif;letter-spacing:.04em;}
.tool{
  font:inherit;font-family:var(--font-read);font-size:.78rem;letter-spacing:.08em;
  background:var(--panel);color:var(--ink-dim);
  border:1px solid var(--rule);border-radius:var(--radius);
  min-height:44px;padding:0 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:color .18s, border-color .18s, background .18s;
}
.tool:hover{color:var(--ink);border-color:var(--rule-2);}
.tool[aria-pressed="true"]{color:var(--signal);border-color:var(--signal);}

:where(button,a,[tabindex]):focus-visible{
  outline:2px solid var(--signal);outline-offset:2px;border-radius:var(--radius);
}

/* ---------- σ gauge : the signature ---------- */
.gauge{padding:16px 0 6px;}
.gauge-head{
  display:flex;align-items:baseline;gap:10px;
  font-family:var(--font-read);font-size:.7rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:9px;
}
html[lang="fa"] .gauge-head{letter-spacing:0;font-size:.78rem;text-transform:none;}
.gauge-head .spread{margin-inline-start:auto;color:var(--signal);font-variant-numeric:tabular-nums;}
.gauge-track{
  direction:ltr;position:relative;height:22px;
  border:1px solid var(--rule);border-radius:var(--radius);
  background:var(--panel);overflow:hidden;
}
.gauge-band{
  position:absolute;top:0;bottom:0;
  background:var(--signal-soft);
  border-inline:1.5px solid var(--signal);
  transition:left .5s cubic-bezier(.22,.7,.3,1), width .5s cubic-bezier(.22,.7,.3,1), opacity .4s;
}
.gauge-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);}
.gauge-tick.mid{background:var(--rule-2);}
.gauge-scale{direction:ltr;position:relative;height:15px;margin-top:3px;}
.gauge-num{
  position:absolute;top:0;transform:translateX(-50%);
  font-family:var(--font-read);font-size:.66rem;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.gauge-num.mid{color:var(--ink);}
.gauge-needle{
  position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--signal);
  opacity:0;transition:left .9s cubic-bezier(.2,.75,.25,1), opacity .3s;
}
.gauge-needle.on{opacity:1;}

/* ---------- panels ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--rule);
  border-radius:var(--radius);
  box-shadow:var(--lift);
}

/* ---------- start screen ---------- */
.start{padding:clamp(22px,4vw,40px);margin-top:14px;}
.start h1{
  font-family:var(--font-display);font-weight:800;
  font-variation-settings:var(--wide);
  font-size:clamp(1.75rem,5vw,2.7rem);line-height:1.12;margin:0 0 12px;
  text-wrap:balance;
}
.lede{color:var(--ink-dim);max-width:56ch;margin:0 0 26px;font-size:1.02rem;}
.specs{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:var(--radius);overflow:hidden;margin-bottom:26px;
}
.spec{background:var(--panel);padding:14px 16px;}
.spec dt{
  font-family:var(--font-read);font-size:.68rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:5px;
}
html[lang="fa"] .spec dt{letter-spacing:0;font-size:.78rem;text-transform:none;}
.spec dd{
  margin:0;font-family:var(--font-display);font-weight:700;font-size:1.35rem;
  font-variation-settings:var(--wide);font-variant-numeric:tabular-nums;
}
.spec dd small{font-size:.72rem;font-weight:400;color:var(--ink-dim);margin-inline-start:4px;font-family:var(--font-body);}

.btn{
  font:inherit;font-family:var(--font-display);font-weight:700;
  font-variation-settings:var(--wide);font-size:1rem;
  background:var(--ink);color:var(--ground);
  border:1px solid var(--ink);border-radius:var(--radius);
  min-height:50px;padding:0 26px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .12s, opacity .18s;
}
.btn:hover{opacity:.88;}
.btn:active{transform:translateY(1px);}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule-2);}
.btn.ghost:hover{border-color:var(--ink);opacity:1;}
.btn[disabled]{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

.note{
  margin-top:24px;padding-top:16px;border-top:1px solid var(--rule);
  color:var(--ink-dim);font-size:.86rem;max-width:62ch;
}

/* ---------- quiz ---------- */
.quiz{margin-top:14px;}
.qhead{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  font-family:var(--font-read);font-size:.72rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-dim);margin-bottom:10px;
}
html[lang="fa"] .qhead{letter-spacing:0;font-size:.82rem;text-transform:none;}
.qhead .lv{color:var(--signal);}
.qhead .cat{margin-inline-start:auto;}

.card{padding:clamp(18px,3.4vw,30px);}
.prompt{
  font-family:var(--font-display);font-weight:600;
  font-size:clamp(1.05rem,2.6vw,1.35rem);line-height:1.45;
  margin:0 0 20px;text-wrap:balance;max-width:60ch;
}

/* specimen plate — the framed stimulus */
.plate{
  position:relative;direction:ltr;
  border:1px solid var(--rule);background:var(--panel-2);
  padding:22px 18px;margin-bottom:24px;
  display:flex;justify-content:center;align-items:center;
  overflow-x:auto;
}
.plate::before,.plate::after{
  content:"";position:absolute;width:9px;height:9px;
  border:1px solid var(--rule-2);pointer-events:none;
}
.plate::before{top:-1px;left:-1px;border-width:1px 0 0 1px;}
.plate::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;}
.plate svg{display:block;height:auto;max-width:100%;}
.plate .seq{
  font-family:var(--font-read);font-weight:500;
  font-size:clamp(1.2rem,4.4vw,2rem);letter-spacing:.14em;
  font-variant-numeric:tabular-nums;white-space:nowrap;
  direction:ltr;
}
html[lang="fa"] .plate .seq{direction:rtl;letter-spacing:.1em;}
.plate .seq i{color:var(--signal);font-style:normal;}

/* options */
.opts{display:grid;gap:10px;}
.opts.grid2{grid-template-columns:repeat(2,minmax(0,1fr));}
@media (min-width:620px){ .opts.grid2{grid-template-columns:repeat(4,minmax(0,1fr));} }

.opt{
  font:inherit;text-align:start;cursor:pointer;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--rule);border-radius:var(--radius);
  padding:12px 14px;min-height:52px;
  display:flex;align-items:center;gap:12px;
  transition:border-color .15s, background .15s, transform .1s;
}
.opts.grid2 .opt{flex-direction:column;justify-content:center;gap:8px;padding:14px 8px;}
.opt:hover{border-color:var(--rule-2);}
.opt .key{
  font-family:var(--font-read);font-size:.78rem;color:var(--ink-dim);
  border:1px solid var(--rule);border-radius:2px;
  width:24px;height:24px;flex:0 0 24px;
  display:grid;place-items:center;transition:color .15s,border-color .15s;
}
.opt .body{flex:1;min-width:0;}
.opt .body .num{font-family:var(--font-read);font-variant-numeric:tabular-nums;font-size:1.15rem;}
.opt svg{display:block;width:72px;height:72px;direction:ltr;}
.opt[aria-checked="true"]{
  border-color:var(--signal);background:var(--signal-soft);
  transform:translateY(1px);
}
.opt[aria-checked="true"] .key{color:var(--signal);border-color:var(--signal);}

.nav{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--rule);
}
.nav .spacer{margin-inline-start:auto;}
.hint{
  font-family:var(--font-read);font-size:.72rem;color:var(--ink-dim);
  letter-spacing:.06em;
}
html[lang="fa"] .hint{letter-spacing:0;font-size:.8rem;}

/* ---------- 30-tick ruler ---------- */
.ruler{
  direction:ltr;display:flex;align-items:flex-end;justify-content:space-between;
  height:26px;margin-top:20px;padding:0 2px;
  border-bottom:1px solid var(--rule);
}
.ruler i{
  flex:0 0 3px;height:8px;background:var(--rule-2);opacity:.55;
  transition:height .2s, background .2s, opacity .2s;
}
.ruler i.lv{height:16px;}
.ruler i.on{background:var(--ink-dim);opacity:1;}
.ruler i.now{background:var(--signal);opacity:1;height:24px;}

/* ---------- result ---------- */
.result{margin-top:14px;}
.reading{padding:clamp(22px,4vw,38px);text-align:center;}
.reading .eyebrow{
  font-family:var(--font-read);font-size:.72rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-dim);
}
html[lang="fa"] .reading .eyebrow{letter-spacing:0;font-size:.82rem;text-transform:none;}
.score{
  font-family:var(--font-display);font-weight:800;
  font-variation-settings:'wdth' 118;
  font-size:clamp(4.5rem,18vw,8.5rem);line-height:.95;
  color:var(--signal);font-variant-numeric:tabular-nums;
  margin:6px 0 2px;letter-spacing:-.01em;
}
html[lang="fa"] .score{letter-spacing:.06em;font-size:clamp(4rem,15vw,7rem);}
.band-name{
  font-family:var(--font-display);font-weight:700;font-size:1.15rem;
  font-variation-settings:var(--wide);
}
.pctl{color:var(--ink-dim);margin-top:6px;font-size:.95rem;}

.curve{direction:ltr;margin:26px auto 0;max-width:560px;}
.curve svg{display:block;width:100%;height:auto;}
.curve-axis{
  max-width:560px;margin-inline:auto;
  direction:ltr;display:flex;justify-content:space-between;
  font-family:var(--font-read);font-size:.68rem;color:var(--ink-dim);
  font-variant-numeric:tabular-nums;margin-top:4px;
}

.sub{margin-top:14px;padding:clamp(18px,3vw,26px);}
h2.sec{
  font-family:var(--font-read);font-size:.72rem;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-dim);font-weight:400;
  margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--rule);
}
html[lang="fa"] h2.sec{letter-spacing:0;font-size:.84rem;text-transform:none;}

.bars{display:grid;gap:14px;}
.barrow{display:grid;grid-template-columns:minmax(88px,auto) 1fr auto;gap:12px;align-items:center;}
.barrow .lbl{font-size:.92rem;}
.barrow .track{display:block;height:7px;background:var(--panel-2);border:1px solid var(--rule);border-radius:2px;overflow:hidden;}
.barrow .fill{display:block;height:100%;background:var(--ink-dim);transition:width .8s cubic-bezier(.2,.75,.25,1);}
.barrow .val{font-family:var(--font-read);font-size:.86rem;color:var(--ink-dim);font-variant-numeric:tabular-nums;}

.review{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden;}
.rev{background:var(--panel);padding:14px 16px;display:grid;gap:8px;}
.rev-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
.rev-n{font-family:var(--font-read);font-size:.76rem;color:var(--ink-dim);font-variant-numeric:tabular-nums;}
.rev-mark{
  font-family:var(--font-read);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  padding:1px 7px;border-radius:2px;border:1px solid currentColor;
}
html[lang="fa"] .rev-mark{letter-spacing:0;font-size:.76rem;text-transform:none;}
.rev-mark.ok{color:var(--right);background:var(--right-soft);}
.rev-mark.no{color:var(--wrong);background:var(--wrong-soft);}
.rev-q{font-size:.95rem;font-weight:500;}
.rev-a{color:var(--ink-dim);font-size:.88rem;display:flex;gap:6px 20px;align-items:center;flex-wrap:wrap;}
.rev-a .pair{display:inline-flex;gap:7px;align-items:center;}
.rev-a svg{width:34px !important;height:34px;direction:ltr;}
.rev-a b{color:var(--right);font-weight:600;}
.rev-why{color:var(--ink-dim);font-size:.88rem;border-inline-start:2px solid var(--rule-2);padding-inline-start:10px;}

/* svg content colors */
.plate, .opt, .rev-a{color:var(--ink);}
svg .qm{fill:var(--signal);font-family:var(--font-read);font-size:34px;font-weight:500;}
svg .cellbox{fill:none;stroke:var(--rule);stroke-width:1.5;}
svg .dash{stroke:var(--rule-2);stroke-dasharray:5 5;}

[hidden]{display:none !important;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.01ms !important;scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>
<div class="shell">

  <header class="bar">
    <div class="brand">
      <b id="brandName">IQ game</b>
      <span id="brandSub">دستگاه سنجش استدلال</span>
    </div>
    <div class="readout" id="timer" role="timer" aria-live="off" hidden>25:00</div>
    <div class="tools">
      <button class="tool" id="langBtn" type="button">EN</button>
      <button class="tool" id="themeBtn" type="button" aria-pressed="false"><span id="themeLbl">شب</span></button>
    </div>
  </header>

  <!-- σ gauge -->
  <section class="gauge" id="gauge">
    <div class="gauge-head">
      <span id="gaugeLbl">دقت سنجش</span>
      <span class="spread" id="gaugeSpread">±۲۲</span>
    </div>
    <div class="gauge-track" id="gaugeTrack">
      <div class="gauge-band" id="gaugeBand"></div>
      <div class="gauge-needle" id="gaugeNeedle"></div>
    </div>
    <div class="gauge-scale" id="gaugeScale"></div>
  </section>

  <main id="stage">

    <!-- ===== START ===== -->
    <section class="panel start" id="screenStart">
      <h1 id="sTitle">آی‌کیوی خودت را اندازه بگیر.</h1>
      <p class="lede" id="sLede"></p>
      <dl class="specs">
        <div class="spec"><dt id="sp1l">سوال</dt><dd><span id="sp1v">۳۰</span></dd></div>
        <div class="spec"><dt id="sp2l">سطح دشواری</dt><dd><span id="sp2v">۵</span></dd></div>
        <div class="spec"><dt id="sp3l">زمان</dt><dd><span id="sp3v">۲۵</span> <small id="sp3u">دقیقه</small></dd></div>
        <div class="spec"><dt id="sp4l">بهترین نتیجه</dt><dd id="sp4v">—</dd></div>
      </dl>
      <div class="btn-row">
        <button class="btn" id="startBtn" type="button">شروع سنجش</button>
        <button class="btn ghost" id="resumeBtn" type="button" hidden>ادامه‌ی آزمون</button>
      </div>
      <p class="note" id="sNote"></p>
    </section>

    <!-- ===== QUIZ ===== -->
    <section class="quiz" id="screenQuiz" hidden>
      <div class="qhead">
        <span class="lv" id="qLevel"></span>
        <span id="qIndex" aria-live="polite"></span>
        <span class="cat" id="qCat"></span>
      </div>
      <div class="panel card">
        <h2 class="prompt" id="qPrompt"></h2>
        <div class="plate" id="qPlate"></div>
        <div class="opts" id="qOpts" role="radiogroup" aria-labelledby="qPrompt"></div>
        <div class="nav">
          <button class="btn ghost" id="prevBtn" type="button">قبلی</button>
          <button class="btn" id="nextBtn" type="button">بعدی</button>
          <span class="spacer"></span>
          <span class="hint" id="qHint"></span>
        </div>
      </div>
      <div class="ruler" id="ruler" aria-hidden="true"></div>
    </section>

    <!-- ===== RESULT ===== -->
    <section class="result" id="screenResult" hidden>
      <div class="panel reading">
        <div class="eyebrow" id="rEyebrow">قرائت نهایی</div>
        <div class="score" id="rScore">—</div>
        <div class="band-name" id="rBand"></div>
        <div class="pctl" id="rPctl"></div>
        <div class="curve" id="rCurve"></div>

let LANG = store.get('lang', 'fa');

/** Localized digits, always tabular. */
function num(n){
  if(LANG !== 'fa') return String(n);
  return String(n).replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]);

/* ============================================================
   3. SVG PRIMITIVES — every stimulus is drawn from a compact spec.
   ============================================================ */
const SW = 2.4;

function ngon(n, r, rot, cx, cy){
  cx = cx===undefined ? 50 : cx; cy = cy===undefined ? 50 : cy; rot = rot||0;
  const p = [];
  for(let i=0;i<n;i++){
    const a = (-90 + rot + i*360/n) * Math.PI/180;
    p.push((cx + r*Math.cos(a)).toFixed(2) + ',' + (cy + r*Math.sin(a)).toFixed(2));
  }
  return p.join(' ');
}

const DOTPOS = {
  1:[[50,50]],
  2:[[34,50],[66,50]],
  3:[[50,31],[32,66],[68,66]],
  4:[[33,33],[67,33],[33,67],[67,67]],
  5:[[33,33],[67,33],[50,50],[33,67],[67,67]],
  6:[[33,29],[67,29],[33,50],[67,50],[33,71],[67,71]]
};

const GLYPH = {
  /* F — chiral, no rotational symmetry */
  f:'M32,20 L74,20 L74,33 L46,33 L46,44 L67,44 L67,57 L46,57 L46,80 L32,80 Z',
  /* P — chiral, distinct from F */
  p:'M30,20 L60,20 A16,16 0 0 1 60,52 L44,52 L44,80 L30,80 Z'
};

/** Draw one 100×100 figure from a spec. Returns SVG inner markup. */
function fig(s){
  if(!s) return '';
  const fill = v => v ? 'currentColor' : 'none';
  const st = 'stroke="currentColor" stroke-width="'+SW+'" stroke-linejoin="round" stroke-linecap="round"';

  switch(s.k){
    case 'q':
      return '<text class="qm" x="50" y="50" text-anchor="middle" dominant-baseline="central">?</text>';

    case 'circ':{
      const r = (s.s||1)*32;
      return '<circle cx="50" cy="50" r="'+r+'" fill="'+fill(s.fill)+'" '+st+'/>' +
             (s.dot ? '<circle cx="50" cy="50" r="6" fill="currentColor"/>' : '');
    }

    case 'poly':{
      const r = (s.s||1)*34;
      return '<polygon points="'+ngon(s.n, r, s.rot||0)+'" fill="'+fill(s.fill)+'" '+st+'/>' +
             (s.dot ? '<circle cx="50" cy="50" r="6" fill="currentColor"/>' : '');
    }

    case 'dots':{
      const pts = DOTPOS[s.n] || DOTPOS[1];
      return pts.map(p => '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="currentColor"/>').join('');
    }

    /* polygon with N dots inside — the "count matches sides" family */
    case 'polydots':{
      const pts = (DOTPOS[s.d]||[]).map(p => [50+(p[0]-50)*0.56, 50+(p[1]-50)*0.56]);
      return '<polygon points="'+ngon(s.n, 40, 0)+'" fill="none" '+st+'/>' +
             pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.6" fill="currentColor"/>').join('');
    }

    /* outer polygon holding an inner polygon */
    case 'nest':
      return '<polygon points="'+ngon(s.n, 40, 0)+'" fill="none" '+st+'/>' +
             '<polygon points="'+ngon(s.i, 19, 0)+'" fill="currentColor" opacity=".85" stroke="none"/>';

    case 'arrow':{
      const sc = s.s || 1;
      const d = 'M50,14 L74,48 L60,48 L60,86 L40,86 L40,48 L26,48 Z';
      return '<g transform="rotate('+(s.rot||0)+' 50 50) translate(50 50) scale('+sc+') translate(-50 -50)">' +
             '<path d="'+d+'" fill="'+fill(s.fill)+'" '+st+'/></g>';
    }

    case 'glyph':{
      const mir = s.mir ? ' translate(100 0) scale(-1 1)' : '';
      return '<g transform="rotate('+(s.rot||0)+' 50 50)'+mir+'">' +
             '<path d="'+GLYPH[s.g]+'" fill="currentColor" stroke="none"/></g>';
    }

    /* 2×2 cell grid — the XOR family */
    case 'grid2':{
      const at = [[16,16],[52,16],[16,52],[52,52]];
      return s.c.map((v,i) =>
        '<rect x="'+at[i][0]+'" y="'+at[i][1]+'" width="32" height="32" rx="2" ' +
        'fill="'+fill(v)+'" stroke="currentColor" stroke-width="2" opacity="'+(v?1:.4)+'"/>'
      ).join('');
    }

    /* square with a dot parked in one corner */
    case 'dotbox':{
      const P = {tl:[32,32], tr:[68,32], br:[68,68], bl:[32,68]};
      const p = P[s.p];
      return '<rect x="16" y="16" width="68" height="68" fill="none" '+st+'/>' +
             '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" fill="currentColor"/>';
    }

    /* paper-folding: sheet, optional fold crease, punched holes */
    case 'fold':{
      const holes = s.h.map(p => '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="currentColor"/>').join('');
      const crease = s.crease ? '<line class="dash" x1="50" y1="12" x2="50" y2="88" stroke="currentColor" stroke-width="2" stroke-dasharray="5 5" opacity=".55"/>' : '';
      return '<rect x="12" y="12" width="76" height="76" fill="none" '+st+'/>' + crease + holes;
    }

    default: return '';
  }
}

/** Isometric cube stack. Own viewBox because it is wider than tall. */
function isoStack(cubes){
  /* C must be exactly 2H, otherwise equal-depth cubes overlap and the stack
     turns into a wireframe mess. */
  const W = 21, H = 12, C = 24, CX = 100, CY = 66;
  const order = cubes.slice().sort((a,b) => (a[0]+a[1]+a[2]) - (b[0]+b[1]+b[2]));
  let out = '';
  order.forEach(c => {
    const px = CX + (c[0]-c[1])*W;
    const py = CY + (c[0]+c[1])*H - c[2]*C;
    const top  = [[px,py-H],[px+W,py],[px,py+H],[px-W,py]];
    const left = [[px-W,py],[px,py+H],[px,py+H+C],[px-W,py+C]];
    const right= [[px+W,py],[px,py+H],[px,py+H+C],[px+W,py+C]];
    const P = a => a.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    out += '<polygon points="'+P(left)+'"  fill="var(--iso-l)"   stroke="currentColor" stroke-width="1.4"/>' +
           '<polygon points="'+P(right)+'" fill="var(--iso-r)"   stroke="currentColor" stroke-width="1.4"/>' +
           '<polygon points="'+P(top)+'"   fill="var(--iso-top)" stroke="currentColor" stroke-width="1.4"/>';
  });
  return '<svg viewBox="0 0 200 140" style="width:min(300px,100%)" aria-hidden="true" focusable="false">'+out+'</svg>';
}

const CELL = 100, GAP = 18;

/** 3×3 matrix of figures; null cell renders the brass "?". */
function matrix(cells){
  const span = CELL*3 + GAP*2;
  let out = '';
  cells.forEach((c,i) => {
    const x = (i%3)*(CELL+GAP), y = Math.floor(i/3)*(CELL+GAP);
    out += '<g transform="translate('+x+' '+y+')">' +
           '<rect class="cellbox" x="1" y="1" width="98" height="98" rx="2"/>' +
           fig(c || {k:'q'}) + '</g>';
  });
  return '<svg viewBox="0 0 '+span+' '+span+'" style="width:min(330px,100%)" aria-hidden="true" focusable="false">'+out+'</svg>';
}

/** A left-to-right sequence of figures, last one usually the "?". */
function strip(cells){
  const w = cells.length*CELL + (cells.length-1)*GAP;
  let out = '';
  cells.forEach((c,i) => {
    out += '<g transform="translate('+(i*(CELL+GAP))+' 0)">' +
           '<rect class="cellbox" x="1" y="1" width="98" height="98" rx="2"/>' +
           fig(c || {k:'q'}) + '</g>';
  });
  return '<svg viewBox="0 0 '+w+' '+CELL+'" style="width:min(560px,100%)" aria-hidden="true" focusable="false">'+out+'</svg>';
}

/** A standalone figure (used for stimuli and every option tile). */
function solo(s, size){
  return '<svg viewBox="0 0 100 100" style="width:'+(size||100)+'px" aria-hidden="true" focusable="false">'+fig(s)+'</svg>';
}

const TOTAL = BANK.length;
const DURATION = 25*60;

/* ============================================================
   5. SCORING
   ============================================================ */
const WEIGHT = {1:1, 2:1.25, 3:1.5, 4:1.75, 5:2};
const MAXRAW = BANK.reduce((s,q) => s + WEIGHT[q.level], 0);

/* percent-correct → z, as a piecewise curve rather than a straight line */
const ANCHORS = [[0,-2.7],[0.15,-1.6],[0.30,-1.0],[0.45,-0.35],[0.50,0],
                 [0.60,0.45],[0.75,1.1],[0.90,1.9],[1,2.7]];

function pctToZ(p){
  p = Math.max(0, Math.min(1, p));
  for(let i=1;i<ANCHORS.length;i++){
    const [x1,y1] = ANCHORS[i-1], [x2,y2] = ANCHORS[i];
    if(p <= x2) return y1 + (y2-y1)*(p-x1)/(x2-x1);
  }
  return 2.7;
}

/** Standard normal CDF (Zelen & Severo) — used for the percentile. */
function phi(z){
  const t = 1/(1 + 0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  const p = d*t*(0.3193815 + t*(-0.3565638 + t*(1.781478 + t*(-1.821256 + t*1.330274))));
  return z > 0 ? 1-p : p;
}

function score(answers, elapsed){
  let raw = 0, answered = 0;
  const cat = {};
  BANK.forEach((q,i) => {
    const c = cat[q.cat] || (cat[q.cat] = {ok:0, n:0});
    c.n++;
    if(answers[i] !== null && answers[i] !== undefined){
      answered++;
      if(answers[i] === q.ans){ raw += WEIGHT[q.level]; c.ok++; }
    }
  });

  let iq = 100 + 15*pctToZ(raw/MAXRAW);

  /* Speed nudges the reading by at most ±3, and only for a mostly-finished test. */
  let bonus = 0;
  if(answered >= TOTAL*0.8){
    const ratio = Math.min(1, elapsed/DURATION);
    bonus = Math.max(-3, Math.min(3, (0.7 - ratio)*8));
    iq += bonus;
  }

  iq = Math.round(Math.max(65, Math.min(145, iq)));
  return {iq, raw, answered, cat, pct: phi((iq-100)/15)};
}

function bandName(iq){
  const b = t('bands');
  let name = b[0][1];
  b.forEach(([min, n]) => { if(iq >= min) name = n; });
  return name;
}

function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [r[i],r[j]] = [r[j],r[i]]; }
  return r;
}
function freshOrder(){
  return BANK.map(q => shuffle(q.opts.map((_,i) => i)));
}

/* --- the σ gauge: ticks drawn once, band + needle updated live --- */
const GMIN = 55, GMAX = 145, INSET = 4;
const gpos = v => INSET + ((v - GMIN)/(GMAX - GMIN))*(100 - INSET*2);

function buildGauge(){
  const track = $('gaugeTrack'), scale = $('gaugeScale');
  [55,70,85,100,115,130,145].forEach(v => {
    const tick = document.createElement('div');
    tick.className = 'gauge-tick' + (v === 100 ? ' mid' : '');
    tick.style.left = gpos(v) + '%';
    track.appendChild(tick);
    const lab = document.createElement('div');
    lab.className = 'gauge-num' + (v === 100 ? ' mid' : '');
    lab.dataset.v = v;
    lab.style.left = gpos(v) + '%';
    lab.textContent = v;
    scale.appendChild(lab);
  });
}

/**
 * The band's width is the measurement's uncertainty — a function of how many
 * items are answered, nothing else. It never reacts to a right or wrong answer,
 * so it cannot leak the answer key back to the player.
 */
function paintGauge(){
  document.querySelectorAll('.gauge-num').forEach(el => { el.textContent = num(+el.dataset.v); });

  const answered = S.answers.filter(a => a !== null).length;
  const halfW = 24 / Math.sqrt(1 + answered*0.62);   // 24 → ~5 across the test
  const band = $('gaugeBand'), needle = $('gaugeNeedle');
  band.style.opacity = (0.35 + 0.65*(1 - halfW/24)).toFixed(2);

  if(S.screen === 'result' && S.result){
    band.style.opacity = '1';
    band.style.left  = gpos(S.result.iq - 3.5) + '%';
    band.style.width = (gpos(GMIN + 7) - gpos(GMIN)) + '%';
    needle.style.left = gpos(S.result.iq) + '%';
    needle.classList.add('on');
    $('gaugeSpread').textContent = '±' + num(4);
  }else{
    band.style.left  = gpos(100 - halfW) + '%';
    band.style.width = (gpos(100 + halfW) - gpos(100 - halfW)) + '%';
    needle.classList.remove('on');
    $('gaugeSpread').textContent = '±' + num(Math.round(halfW));
  }
}

function buildRuler(){
  const r = $('ruler');
  r.innerHTML = '';
  BANK.forEach((q,i) => {
    const el = document.createElement('i');
    if(i % 6 === 0) el.classList.add('lv');
    r.appendChild(el);
  });
}
function paintRuler(){
  const kids = $('ruler').children;
  for(let i=0;i<kids.length;i++){
    kids[i].classList.toggle('on',  S.answers[i] !== null);
    kids[i].classList.toggle('now', i === S.idx);
  }
}

function paintTimer(){
  const el = $('timer');
  if(S.screen !== 'quiz'){ el.hidden = true; return; }
  el.hidden = false;
  const m = Math.floor(S.remaining/60), s = S.remaining % 60;
  el.textContent = num(m) + ':' + num(s < 10 ? '0'+s : s);
  el.classList.toggle('hot', S.remaining <= 120);
}

  $('screenStart').hidden  = name !== 'start';
  $('screenQuiz').hidden   = name !== 'quiz';
  $('screenResult').hidden = name !== 'result';
  $('gauge').hidden = false;

function renderBest(){
  const best = store.get('best', null);
  $('sp4v').textContent = best ? num(best) : '—';
  const saved = store.get('session', null);
  $('resumeBtn').hidden = !(saved && saved.remaining > 5 && saved.answers.some(a => a !== null));
}

/* ---------- quiz ---------- */
function stimulusFor(q){
  if(q.matrix) return matrix(q.matrix);
  if(q.strip)  return strip(q.strip);
  if(q.iso)    return isoStack(q.iso);
  if(q.solo)   return solo(q.solo, 130);
  if(q.seq){
    const parts = q.seq.map(n => num(n)).concat(['<i>?</i>']);
    const sep = LANG === 'fa' ? '،' : ',';
    return '<div class="seq">' + parts.join('&nbsp;' + sep + '&nbsp;&nbsp;') + '</div>';
  }
  return '';
}

function optionMarkup(opt){
  if(opt.s) return solo(opt.s, 72);
  if(opt.n !== undefined) return '<span class="num">' + num(opt.n) + '</span>';
  return '<span>' + tx(opt.t) + '</span>';
}

function renderQuestion(){
  const q = BANK[S.idx];
  const order = S.order[S.idx];
  const compact = q.opts.every(o => o.s || o.n !== undefined);

  $('qLevel').textContent = t('level') + ' ' + num(q.level);
  $('qIndex').textContent = t('qof').replace('%1', num(S.idx+1)).replace('%2', num(TOTAL));
  $('qCat').textContent   = t('cat')[q.cat];
  $('qPrompt').textContent = tx(q.prompt);

  const plate = $('qPlate');
  const stim = stimulusFor(q);
  plate.innerHTML = stim;
  plate.hidden = !stim;
  if(stim && !q.seq){ plate.setAttribute('role','img'); plate.setAttribute('aria-label', t('figure')); }
  else { plate.removeAttribute('role'); plate.removeAttribute('aria-label'); }

  const box = $('qOpts');
  box.className = 'opts' + (compact ? ' grid2' : '');
  box.innerHTML = '';

  order.forEach((origIdx, pos) => {
    const chosen = S.answers[S.idx] === origIdx;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', chosen ? 'true' : 'false');
    b.tabIndex = chosen || (S.answers[S.idx] === null && pos === 0) ? 0 : -1;
    b.dataset.orig = origIdx;
    if(q.opts[origIdx].s) b.setAttribute('aria-label', t('optLabel').replace('%1', t('ansPrefix')[pos]));
    b.innerHTML = '<span class="key" aria-hidden="true">' + t('ansPrefix')[pos] + '</span>' +
                  '<span class="body">' + optionMarkup(q.opts[origIdx]) + '</span>';
    b.addEventListener('click', () => choose(origIdx));
    box.appendChild(b);
  });

  $('prevBtn').disabled = S.idx === 0;
  $('nextBtn').textContent = S.idx === TOTAL-1 ? t('finish') : t('next');
  paintRuler();
  paintGauge();
}

function choose(origIdx){
  S.answers[S.idx] = origIdx;
  Array.from($('qOpts').children).forEach(b => {
    const on = +b.dataset.orig === origIdx;
    b.setAttribute('aria-checked', on ? 'true' : 'false');
    b.tabIndex = on ? 0 : -1;
  });
  paintRuler();
  paintGauge();
  saveSession();
}

function go(step){
  const next = S.idx + step;
  if(next < 0) return;
  if(next >= TOTAL){ finish(); return; }
  S.idx = next;
  renderQuestion();
  saveSession();
}

/* ---------- timer ---------- */
function startClock(){
  stopClock();
  S.tick = setInterval(() => {
    S.remaining--;
    S.elapsed = DURATION - S.remaining;
    paintTimer();
    if(S.remaining % 5 === 0) saveSession();
    if(S.remaining <= 0) finish();
  }, 1000);
}
function stopClock(){ if(S.tick){ clearInterval(S.tick); S.tick = null; } }

function saveSession(){
  store.set('session', {answers:S.answers, idx:S.idx, remaining:S.remaining, order:S.order});
}

/* ---------- result ---------- */
function bellSVG(iq){
  const W = 560, H = 130;
  const pt = i => {
    const x = 55 + 90*i/180;
    const y = Math.exp(-0.5*Math.pow((x-100)/15, 2));
    return [(i/180)*W, H - y*(H-8)];
  };
  let d = '';
  for(let i=0;i<=180;i++){
    const p = pt(i);
    d += (i ? ' L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1);
  }
  const area = d + ' L' + W + ',' + H + ' L0,' + H + ' Z';
  const x = ((Math.max(55, Math.min(145, iq)) - 55)/90)*W;

  return '<svg viewBox="0 0 '+W+' '+(H+14)+'" role="img" aria-label="'+
         (LANG==='fa' ? 'جایگاه شما روی منحنی توزیع' : 'Your position on the distribution curve')+'">' +
    '<defs><clipPath id="leftOf"><rect x="0" y="0" width="'+x.toFixed(1)+'" height="'+H+'"/></clipPath></defs>' +
    '<path d="'+area+'" fill="var(--rule)" opacity=".5"/>' +
    '<path d="'+area+'" fill="var(--signal-soft)" clip-path="url(#leftOf)"/>' +
    '<path d="'+d+'" fill="none" stroke="var(--ink-dim)" stroke-width="1.5"/>' +
    '<line x1="0" y1="'+H+'" x2="'+W+'" y2="'+H+'" stroke="var(--rule-2)" stroke-width="1"/>' +
    '<line x1="'+x.toFixed(1)+'" y1="6" x2="'+x.toFixed(1)+'" y2="'+(H+8)+'" stroke="var(--signal)" stroke-width="2.5"/>' +
    '<circle cx="'+x.toFixed(1)+'" cy="6" r="4" fill="var(--signal)"/>' +
    '</svg>';
}

function countUp(el, to){
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ el.textContent = num(to); return; }
  const from = 55, dur = 1100, t0 = performance.now();
  (function step(now){
    const k = Math.min(1, (now-t0)/dur);
    const e = 1 - Math.pow(1-k, 3);
    el.textContent = num(Math.round(from + (to-from)*e));
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}

function renderResult(){
  const r = S.result;
  countUp($('rScore'), r.iq);
  $('rBand').textContent = bandName(r.iq);
  $('rPctl').textContent = t('pctl').replace('%1', num(Math.round(r.pct*100)));
  $('rCurve').innerHTML = bellSVG(r.iq);

  const bars = $('rBars');
  bars.innerHTML = '';
  ['numerical','verbal','logical','spatial'].forEach(key => {
    const c = r.cat[key]; if(!c) return;
    const p = Math.round(c.ok/c.n*100);
    const row = document.createElement('div');
    row.className = 'barrow';
    row.innerHTML = '<span class="lbl">' + t('cat')[key] + '</span>' +
      '<span class="track"><span class="fill" style="width:0%"></span></span>' +
      '<span class="val">' + t('outOf').replace('%1', num(c.ok)).replace('%2', num(c.n)) + '</span>';
    bars.appendChild(row);
    requestAnimationFrame(() => { row.querySelector('.fill').style.width = p + '%'; });
  });

  const rev = $('rReview');
  rev.innerHTML = '';
  BANK.forEach((q,i) => {
    const given = S.answers[i];
    const ok = given === q.ans;
    const d = document.createElement('div');
    d.className = 'rev';
    const mark = given === null ? '<span class="rev-mark no">'+t('skipped')+'</span>'
               : ok ? '<span class="rev-mark ok">'+t('correct')+'</span>'
                    : '<span class="rev-mark no">'+t('wrong')+'</span>';
    const answerBit = ok ? ''
      : '<div class="rev-a">' +
        (given === null ? '<span class="pair">'+t('noAns')+'</span>'
                        : '<span class="pair">'+t('yourAns')+optionMarkup(q.opts[given])+'</span>') +
        '<span class="pair">'+t('rightAns')+'<b>' + optionMarkup(q.opts[q.ans]) + '</b></span></div>';
    d.innerHTML =
      '<div class="rev-top"><span class="rev-n">' + num(i+1) + ' · ' + t('level') + ' ' + num(q.level) + '</span>' + mark + '</div>' +
      '<div class="rev-q">' + tx(q.prompt) + '</div>' +
      answerBit +
      '<div class="rev-why">' + tx(q.why) + '</div>';
    rev.appendChild(d);
  });
}

/* ============================================================
   9. FLOW
   ============================================================ */
function begin(fresh){
  if(fresh){
    S.idx = 0;
    S.answers = new Array(TOTAL).fill(null);
    S.order = freshOrder();
    S.remaining = DURATION;
    S.elapsed = 0;
  }
  S.result = null;
  show('quiz');
  buildRuler();
  renderQuestion();
  startClock();
  saveSession();
}

function finish(){
  stopClock();
  S.elapsed = DURATION - Math.max(0, S.remaining);
  S.result = score(S.answers, S.elapsed);
  store.del('session');
  const best = store.get('best', 0);
  if(S.result.iq > best) store.set('best', S.result.iq);
  show('result');
  renderResult();
  renderBest();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   10. WIRING
   ============================================================ */
buildGauge();

$('langBtn').addEventListener('click', () => {
  LANG = LANG === 'fa' ? 'en' : 'fa';
  store.set('lang', LANG);
  applyLang();
});

$('themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const next = cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark');
  store.set('theme', next);
  applyTheme(next);
});

$('startBtn').addEventListener('click', () => begin(true));

$('resumeBtn').addEventListener('click', () => {
  const s = store.get('session', null);
  if(!s) return begin(true);
  S.answers   = s.answers;
  S.idx       = s.idx;
  S.remaining = s.remaining;
  S.order     = (s.order && s.order.length === TOTAL) ? s.order : freshOrder();
  begin(false);
});

$('prevBtn').addEventListener('click', () => go(-1));
$('nextBtn').addEventListener('click', () => go(1));
$('againBtn').addEventListener('click', () => {
  S.answers = new Array(TOTAL).fill(null);
  S.order = freshOrder();
  S.idx = 0;
  S.remaining = DURATION;
  S.result = null;
  show('start');
  renderBest();
  window.scrollTo({top:0});
});

document.addEventListener('keydown', e => {
  if(S.screen !== 'quiz') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const opts = Array.from($('qOpts').children);

  const byKey = '1234'.indexOf(e.key);
  const byLetter = 'abcd'.indexOf(e.key.toLowerCase());
  const pick = byKey >= 0 ? byKey : byLetter;
  if(pick >= 0 && pick < opts.length){
    e.preventDefault();
    choose(+opts[pick].dataset.orig);
    return;
  }
  if(e.key === 'Enter'){ e.preventDefault(); go(1); return; }

  if(e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const active = document.activeElement;
    if(!active || !active.classList.contains('opt')) return;
    e.preventDefault();
    const fwd = (e.key === 'ArrowDown') ||
                (e.key === (LANG === 'fa' ? 'ArrowLeft' : 'ArrowRight'));
    const i = opts.indexOf(active);
    const nxt = opts[(i + (fwd ? 1 : opts.length-1)) % opts.length];
    nxt.focus();
    choose(+nxt.dataset.orig);
  }
});

/* restore preferences, then paint */
const savedTheme = store.get('theme', null);
if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
S.order = freshOrder();
applyLang();
show('start');

/* Follow the OS theme while no explicit choice is stored. addEventListener on a
   MediaQueryList is Safari 14+, so fall back to the deprecated addListener. */
(function(){
  const onSys = () => applyTheme(document.documentElement.getAttribute('data-theme'));
  try{
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', onSys);
    else if(mq.addListener) mq.addListener(onSys);
  }catch(e){}
})();
</script>
